<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>剛毛を、刺せ。</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f6;--ink:#15161d;--sub:#586075;--line:#b9c0d0;--accent:#e8401f;--accent-text:#fff;
  --panel:#bfe3f4;--dot:#a2cfe6;--card:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e121c;--ink:#f0f2f8;--sub:#98a0b6;--line:#2c3550;--accent:#ff6a4d;--accent-text:#1a0904;--card:#171d2d;
  }
}
:root[data-theme="dark"]{
  --bg:#0e121c;--ink:#f0f2f8;--sub:#98a0b6;--line:#2c3550;--accent:#ff6a4d;--accent-text:#1a0904;--card:#171d2d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  -webkit-tap-highlight-color:transparent;line-height:1.7;
}
main{max-width:480px;margin:0 auto;padding:14px 12px 28px}
h1{margin:0 0 8px;text-align:center;font-weight:800;font-size:22px;letter-spacing:.2em;padding-left:.2em}
.stagename{text-align:center;font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--accent);margin:-4px 0 8px}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px}
.meter{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.lab{white-space:nowrap;color:var(--sub);letter-spacing:.1em}
.bar{position:relative;flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;background:var(--card);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);transition:width .25s ease}
.bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:90%}
#pct{min-width:7.2em;font-size:12px;white-space:nowrap;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.ammo{white-space:nowrap}
.ammo strong{font-size:17px;font-variant-numeric:tabular-nums}
.ammo.low strong{color:var(--accent)}
.snd{font:inherit;font-size:12px;padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--sub);cursor:pointer}
.stage{
  position:relative;border:3px solid var(--ink);border-radius:10px;overflow:hidden;
  background-color:var(--panel);
  background-image:radial-gradient(var(--dot) 1.6px,transparent 1.8px);background-size:14px 14px;
  box-shadow:5px 5px 0 var(--ink);
}
canvas{display:block;width:100%;touch-action:none;cursor:crosshair;-webkit-user-select:none;user-select:none}
.hint{margin:14px 0 0;text-align:center;color:var(--sub);font-size:13px;letter-spacing:.06em}
.btn{
  font:inherit;font-size:16px;font-weight:800;letter-spacing:.2em;padding:10px 28px;border-radius:999px;
  border:2.5px solid var(--ink);background:var(--accent);color:var(--accent-text);cursor:pointer;
  box-shadow:3px 3px 0 var(--ink)
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.ov{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:rgba(10,14,24,.72);overflow-y:auto;
}
.ov[hidden]{display:none}
.card{
  width:min(100%,420px);margin:auto;text-align:center;background:var(--card);color:var(--ink);
  border:3px solid var(--ink);border-radius:14px;padding:22px 18px 20px;box-shadow:6px 6px 0 var(--ink);
  animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;
}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-size:30px;font-weight:800;letter-spacing:.14em;padding-left:.14em}
.card p{margin:0 0 14px;color:var(--sub);font-size:14px}
.card ul{margin:0 0 18px;padding:0;list-style:none;font-size:14px;text-align:left;display:inline-block}
.card li{margin:2px 0}
.card li::before{content:"✦ ";color:var(--accent)}
#ovClear .card{width:min(100%,460px);padding:16px 16px 22px}
#ovClear img{display:block;width:100%;height:auto;border:2.5px solid var(--ink);border-radius:8px;animation:imgin 1s ease-out both}
@keyframes imgin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.c1,.c2,.c3{opacity:0;animation:rise .8s ease-out forwards}
#ovClear p.c1{margin:18px 0 0;font-size:20px;font-weight:800;letter-spacing:.3em;color:var(--ink);animation-delay:.9s}
#ovClear p.c2{margin:2px 0 0;font-size:18px;font-weight:600;letter-spacing:.2em;color:var(--ink);animation-delay:1.6s}
#ovClear p.c3{margin:0 0 14px;font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-style:italic;font-weight:800;
  font-size:clamp(40px,12.5vw,58px);line-height:1.2;color:var(--accent);animation-delay:2.4s}
#again2{opacity:0;animation:rise .8s ease-out 3.3s forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .card,#ovClear img{animation:none}
  .c1,.c2,.c3,#again2{animation-duration:.01s;animation-delay:0s!important}
  .bar i{transition:none}
}
</style>
</head>
<body>
<main>
  <h1>剛毛を、刺せ。</h1>
  <div class="stagename" id="stg"></div>
  <div class="hud">
    <div class="meter"><span class="lab">発毛</span><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barwrap"><i id="fill"></i></div><span id="pct">0%</span></div>
    <div class="ammo" id="ammoWrap">のこり <strong id="ammo">0</strong> 本</div>
    <button class="snd" id="snd" type="button" aria-pressed="true">音 ON</button>
  </div>
  <div class="stage"><canvas id="cv" aria-label="動くハゲ頭に剛毛を刺すゲーム盤面"></canvas></div>
  <p class="hint">ドラッグでねらう → 指を離して発射　髪型とヒゲ型の場所は、秘密。</p>
</main>

<div class="ov" id="ovStart">
  <div class="card">
    <h2>剛毛を、刺せ。</h2>
    <p>ボヨンボヨン動くハゲに、一本ずつ。<br>どこに生えるかは、刺してみないとわからない。</p>
    <ul>
      <li>ドラッグでねらい、離すと発射</li>
      <li>生える場所は秘密。顔のどこかにある</li>
      <li>だいたいの場所に刺すと、髪型やヒゲが「ぽんっ」と乗る</li>
      <li>髪もヒゲも全部生やせば次のハゲへ。全5体</li>
    </ul><br>
    <button class="btn" id="startBtn" type="button">はじめる</button>
  </div>
</div>

<div class="ov" id="ovNext" hidden>
  <div class="card">
    <h2 id="nxTitle"></h2>
    <p id="nxText"></p>
    <button class="btn" id="nextBtn" type="button">つぎへ</button>
  </div>
</div>

<div class="ov" id="ovOver" hidden>
  <div class="card">
    <h2>剛毛が尽きた</h2>
    <p>ハゲは、ハゲのままだった。<br>同じ相手に、もう一度。</p>
    <button class="btn" id="againBtn" type="button">もう一度</button>
  </div>
</div>

<div class="ov" id="ovClear" hidden>
  <div class="card">
    <img id="clearImg" alt="書斎でパイプを持つ白髭の辛口評論家「Pochi the great 先生」" src="">
    <p class="c1">おめでとう</p>
    <p class="c2">今日から君は</p>
    <p class="c3">Higesophia</p>
    <button class="btn" id="again2" type="button">もう一度</button>
  </div>
</div>

function mkSpots(){
  return Object.keys(SLOTS).sort(()=>rand()-.5).slice(0,S.sn).map(id=>{
    const d=SLOTS[id],list=STY[id];
    let p=list[Math.floor(rand()*list.length)];
    if(S.look===4)p=id==='crown'?list[2]:(id==='mustache'||id==='chin')?list[1]:p;
    return{id,k:d.k,bx:d.pair?[-d.x,d.x]:[d.x],y:d.y,hw:d.w*S.hb,hh:d.h*S.hb,h:0,g:-1,sty:p[0],polys:id==='side'?p[1]:p[1].map(sym),rn:Array.from({length:240},rand)};
  });
}

function hud(){
  const H=spots.filter(s=>s.k==='h'),B=spots.filter(s=>s.k==='b'),n=a=>a.filter(s=>s.g>=0).length;

  $('stg').textContent='STAGE '+(si+1)+' / '+ST.length+'　'+S.n;
  $('fill').style.width=(spots.length?g/spots.length*100:0)+'%';

let AC=null,soundOn=true;
function beep(f,d,ty,g,sl){
  if(!soundOn)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),gn=AC.createGain(),n=AC.currentTime;
    o.type=ty||'sine';o.frequency.setValueAtTime(f,n);
    if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+sl),n+d);
    gn.gain.setValueAtTime(g||.08,n);gn.gain.exponentialRampToValueAtTime(.0001,n+d);
    o.connect(gn);gn.connect(AC.destination);o.start(n);o.stop(n+d);}catch(e){}
}

const wp=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}};
const off=e=>(e.pointerType==='touch'||e.pointerType==='pen')?-72/scale:0;
const setCur=e=>{const p=wp(e);cur={x:clamp(p.x,0,WW),y:clamp(p.y+off(e),0,WH)}};
cv.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}aiming=true;setCur(e)});
cv.addEventListener('pointermove',e=>{if(!aiming)return;e.preventDefault();setCur(e)});
cv.addEventListener('pointerup',()=>{if(!aiming)return;aiming=false;fire(cur.x,cur.y)});
cv.addEventListener('pointercancel',()=>{aiming=false});
function fire(x,y){
  if(state!=='play'||ammo<=0||fireCD>0)return;
  ammo--;fireCD=.12;flights.push({sx:LP.x,sy:LP.y,tx:x,ty:y,t0:t,dur:.16});sfx.fire();hud();
}

function toLocal(x,y){
  const dx=x-px,dy=y-py,c=Math.cos(-rot),s=Math.sin(-rot),k=S.sc;
  return{x:(dx*c-dy*s)/(sx*k),y:(dx*s+dy*c)/(sy*k)};
}
const ft=(txt,x,y)=>floats.push({txt,x,y,t0:t});
function kick(b){spr.sqv+=b?4.6:3.2;spr.rotv+=(rand()-.5)*(b?7:5);spr.byv+=b?200:130}
function impact(f){
  const l=toLocal(f.tx,f.ty);
  if(!ell(l.x,l.y,0,-5,102,128)){ft('はずれ',f.tx,f.ty-8);sfx.miss();return}
  stuck.push({x:l.x,y:l.y,a:Math.atan2(f.sy-f.ty,f.sx-f.tx)-rot+(rand()-.5)*.7,len:24+rand()*6});
  hurt=.35;
  let best=null,bd=1e9;
  spots.forEach(s=>{if(s.g<0){const d=Math.min(...s.bx.map(bx=>Math.max(Math.abs(l.x-bx)/s.hw,Math.abs(l.y-s.y)/s.hh)));if(d<bd){bd=d;best=s}}});
  if(best&&bd<=1){
    best.h++;
    if(best.h>=S.hit){best.g=t;ft(best.sty+'！',f.tx,f.ty-12);kick(1);sfx.grow();hud();if(spots.every(s=>s.g>=0))stageDone();}
    else{ft('ムズッ',f.tx,f.ty-12);kick();sfx.hit()}
  }else if(best&&bd<=1.8){ft('ムズムズ…',f.tx,f.ty-12);kick();sfx.hit()}
  else{ft('つるん',f.tx,f.ty-12);kick();sfx.miss()}
}
function stageDone(){
  state='won';aiming=false;cheer=1.4;sfx.clear();
  if(si===ST.length-1){
    $('clearImg').src=IMG;
    setTimeout(()=>{$('ovClear').hidden=false;$('ovClear').scrollTop=0},1200);
  }else setTimeout(()=>{
    const nx=ST[si+1];
    $('nxTitle').textContent='STAGE '+(si+1)+' クリア！';
    $('nxText').textContent=(si+1===ST.length-1?'ラスボス出現 ── ':'次の相手 ── ')+'「'+nx.n+'」';
    $('ovNext').hidden=false;
  },1200);
}
function gameOver(){state='over';sfx.over();setTimeout(()=>{$('ovOver').hidden=false},500)}

const sp=(k,c,x,v,dt)=>{v+=(-k*x-c*v)*dt;return[x+v*dt,v]};
function update(dt){
  t+=dt;phase+=dt*S.spd;
  if(fireCD>0)fireCD-=dt;if(hurt>0)hurt-=dt;
  if(cheer>0){cheer-=dt;if(Math.floor(t*6)!==Math.floor((t-dt)*6)){spr.sqv+=2.6;spr.rotv+=(rand()-.5)*5}}
  if(S.dash&&state==='play'){dashT-=dt;if(dashT<=0){spr.dxv+=(rand()<.5?-1:1)*420*S.dash;dashT=(3.2/S.dash)*(.7+rand()*.6)}}
  [spr.sq,spr.sqv]=sp(120,6,spr.sq,spr.sqv,dt);[spr.rot,spr.rotv]=sp(90,4.5,spr.rot,spr.rotv,dt);
  [spr.by,spr.byv]=sp(100,5.5,spr.by,spr.byv,dt);[spr.dx,spr.dxv]=sp(22,3,spr.dx,spr.dxv,dt);
  const q=spr.sq+.04*Math.sin(t*5.6);sy=1-q*.9;sx=1+q*.7;rot=spr.rot+.035*Math.sin(t*2.3);
  px=clamp(200+S.ax*Math.sin(phase*.9)+spr.dx,95,305);py=218+S.ay*Math.sin(phase*1.5+1.2)+spr.by;
  for(let i=flights.length-1;i>=0;i--)if(t-flights[i].t0>=flights[i].dur){const f=flights[i];flights.splice(i,1);impact(f)}
  for(let i=floats.length-1;i>=0;i--)if(t-floats[i].t0>.9)floats.splice(i,1);
  if(state==='play'&&ammo<=0&&!flights.length&&!endTimer)endTimer=setTimeout(()=>{endTimer=null;if(state==='play')gameOver()},400);
}

function ep(c,cx,cy,rx,ry){c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,6.283)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function drawSpot(c,s){
  if(s.g<0){
    if(s.h>0){c.save();c.setLineDash([5,5]);c.strokeStyle='rgba(20,21,28,.45)';c.lineWidth=2.5;s.bx.forEach(bx=>{rr(c,bx-s.hw,s.y-s.hh,s.hw*2,s.hh*2,10);c.stroke()});c.restore()}
    return;
  }
  const k=Math.min(1,(t-s.g)/.5),e=1+2.6*Math.pow(k-1,3)+1.6*Math.pow(k-1,2);
  s.bx.forEach(bx=>{
  c.save();c.translate(bx,s.y);if(bx<0)c.scale(-1,1);c.scale(e,e);
  let n=0;
  s.polys.forEach(p=>{
    let cx=0,cy=0;p.forEach(q=>{cx+=q[0];cy+=q[1]});cx/=p.length;cy/=p.length;
    c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();
    c.fillStyle='#2a2a34';c.fill();
    c.save();c.clip();c.strokeStyle='#6d6f84';c.lineWidth=1.3;
    for(let i=0;i<26;i++){const q=p[Math.floor(s.rn[n++%240]*p.length)],a=Math.atan2(q[1]-cy,q[0]-cx);
      c.beginPath();c.moveTo(q[0]-Math.cos(a)*14,q[1]-Math.sin(a)*14);c.lineTo(q[0],q[1]);c.stroke()}
    c.restore();
    c.strokeStyle=INK;c.lineWidth=3;c.stroke();c.lineWidth=2.4;
    for(let i=0;i<p.length;i++){
      const a=p[i],b=p[(i+1)%p.length],m=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])/6));
      for(let j=0;j<m;j++){const u=j/m,x=a[0]+(b[0]-a[0])*u,y=a[1]+(b[1]-a[1])*u,
        ag=Math.atan2(y-cy,x-cx)+(s.rn[n++%240]-.5)*.9,l=5+s.rn[n++%240]*7;
        c.beginPath();c.moveTo(x,y);c.lineTo(x+Math.cos(ag)*l,y+Math.sin(ag)*l);c.stroke()}
    }
  });
  c.restore();
  });
}
function drawHead(c){
  const lk=S.look;
  c.lineJoin=c.lineCap='round';c.strokeStyle=INK;c.lineWidth=5;
  if(lk===4){ // aura
    c.fillStyle='rgba(120,60,255,.55)';
    for(let i=0;i<12;i++){const a=i*.5236+t*.4,h=34+16*Math.sin(t*7+i*2);
      c.beginPath();c.moveTo(Math.cos(a-.2)*108,Math.sin(a-.2)*134-5);c.lineTo(Math.cos(a)*(108+h),Math.sin(a)*(134+h)-5);c.lineTo(Math.cos(a+.2)*108,Math.sin(a+.2)*134-5);c.fill();}
    c.fillStyle='#2a2238'; // horns
    [-1,1].forEach(m=>{c.beginPath();c.moveTo(m*40,-122);c.lineTo(m*92,-182);c.lineTo(m*72,-96);c.closePath();c.fill();c.stroke()});
  }
  [-1,1].forEach(m=>{ep(c,m*104,0,12,22);c.fillStyle=S.skin;c.fill();c.stroke()});
  ep(c,0,-5,102,128);c.fillStyle=S.skin;c.fill();c.stroke();
  c.save();c.globalAlpha=lk===1?.95:.6;c.fillStyle='#fff';c.beginPath();c.ellipse(-38,-92,lk===1?34:24,10,-.55,0,6.283);c.fill();c.restore();
  if(lk>0){c.lineWidth=3;c.beginPath();c.moveTo(-36,-64);c.quadraticCurveTo(0,-74,36,-64);c.stroke()}
  if(lk===4){c.lineWidth=3;c.beginPath();c.moveTo(10,-128);c.lineTo(2,-108);c.lineTo(16,-96);c.lineTo(6,-78);c.stroke()}
  if(lk===0){c.fillStyle='rgba(255,120,120,.45)';[-62,62].forEach(x=>{ep(c,x,16,14,9);c.fill()})}
  c.lineWidth=4;ep(c,0,2,13,16);c.fillStyle='rgba(0,0,0,.08)';c.fill();c.strokeStyle=INK;c.stroke();
  const ang=lk>=3,bl=hurt>0?-7:0;
  c.lineWidth=9;c.beginPath();
  if(ang){c.moveTo(-70,-70);c.lineTo(-16,-50);c.moveTo(70,-70);c.lineTo(16,-50)}
  else{c.moveTo(-68,-58+bl);c.lineTo(-18,-52+bl*.5);c.moveTo(68,-58+bl);c.lineTo(18,-52+bl*.5)}
  c.stroke();
  let ox=clamp((cur.x-px)/30,-5,5),oy=clamp((cur.y-py)/60,-3,5);if(!aiming){ox*=.4;oy*=.4}
  if(lk===2){c.lineWidth=5;c.fillStyle=INK;[-40,40].forEach(x=>{rr(c,x-30,-44,60,38,12);c.fill();c.stroke()});
    c.strokeStyle='#fff';c.lineWidth=3;c.beginPath();c.moveTo(-60,-38);c.lineTo(-50,-30);c.moveTo(20,-38);c.lineTo(30,-30);c.stroke()}
  else{
    if(lk===1){c.lineWidth=7;[-40,40].forEach(x=>{rr(c,x-30,-46,60,44,14);c.fillStyle='rgba(255,255,255,.55)';c.fill();c.stroke()})}
    c.lineWidth=4;c.strokeStyle=INK;
    if(hurt>0){c.beginPath();c.moveTo(-50,-32);c.lineTo(-32,-24);c.lineTo(-50,-16);c.moveTo(50,-32);c.lineTo(32,-24);c.lineTo(50,-16);c.stroke()}
    else[-40,40].forEach(x=>{
      if(lk===4){c.fillStyle='#ff2d2d';c.beginPath();c.arc(x+ox,-24+oy,10,0,6.283);c.fill();c.stroke();c.fillStyle='#ffe';c.beginPath();c.arc(x+ox,-24+oy,3.5,0,6.283);c.fill()}
      else{c.fillStyle=INK;c.beginPath();c.arc(x+ox,-24+oy,lk===0?7.5:6.5,0,6.283);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(x+ox-2,-26+oy,2,0,6.283);c.fill()}});
  }
  if(lk===3){c.strokeStyle='#b3262e';c.lineWidth=4;c.beginPath();c.moveTo(-62,-52);c.lineTo(-24,-4);c.stroke();
    c.lineWidth=2;for(let i=0;i<3;i++){c.beginPath();c.moveTo(-52+i*10,-38+i*12);c.lineTo(-44+i*10,-46+i*12);c.stroke()}}
  // mouth
  c.strokeStyle=INK;c.lineWidth=4;
  if(lk>=3&&hurt<=0){rr(c,-26,56,52,20,6);c.fillStyle='#fff';c.fill();c.stroke();c.beginPath();c.moveTo(-13,56);c.lineTo(-13,76);c.moveTo(0,56);c.lineTo(0,76);c.moveTo(13,56);c.lineTo(13,76);c.stroke()}
  else{ep(c,0,66,hurt>0?15:11,hurt>0?10:5);c.fillStyle=INK;c.fill()}
  spots.forEach(s=>drawSpot(c,s));
  stuck.forEach(s=>{const ex=s.x+Math.cos(s.a)*s.len,ey=s.y+Math.sin(s.a)*s.len;
    c.strokeStyle=INK;c.lineWidth=4.2;c.beginPath();c.moveTo(s.x,s.y);c.lineTo(ex,ey);c.stroke();
    c.strokeStyle='#8d8fa3';c.lineWidth=1.4;c.beginPath();c.moveTo(s.x+1,s.y);c.lineTo(ex,ey);c.stroke()});
}
function bristle(c,x,y,a,len){
  const ex=x+Math.cos(a)*len,ey=y+Math.sin(a)*len;c.lineCap='round';
  c.strokeStyle=INK;c.lineWidth=4.2;c.beginPath();c.moveTo(x,y);c.lineTo(ex,ey);c.stroke();
  c.strokeStyle='#8d8fa3';c.lineWidth=1.4;c.beginPath();c.moveTo(x+1,y);c.lineTo(ex,ey);c.stroke();
}
function draw(){
  const c=ctx;c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);
  c.setTransform(scale*dpr,0,0,scale*dpr,0,0);
  c.fillStyle='rgba(20,21,28,.2)';c.beginPath();c.ellipse(px,446,100*S.sc,11,0,0,6.283);c.fill();
  c.save();c.translate(px,py);c.rotate(rot);c.scale(sx*S.sc,sy*S.sc);drawHead(c);c.restore();
  c.lineCap='round';c.strokeStyle=INK;c.lineWidth=6;
  c.beginPath();c.moveTo(180,556);c.lineTo(197,504);c.moveTo(220,556);c.lineTo(203,504);c.stroke();
  if(ammo>0&&fireCD<=0&&state==='play')bristle(c,200,500,-Math.PI/2,32);
  if(aiming&&state==='play'){
    c.save();c.setLineDash([3,7]);c.lineWidth=2;c.strokeStyle='rgba(20,21,28,.45)';
    c.beginPath();c.moveTo(LP.x,LP.y-6);c.lineTo(cur.x,cur.y);c.stroke();c.setLineDash([]);
    c.lineWidth=3;c.strokeStyle='#e8401f';c.beginPath();c.arc(cur.x,cur.y,13,0,6.283);c.stroke();
    c.lineWidth=2.5;c.beginPath();c.moveTo(cur.x-20,cur.y);c.lineTo(cur.x+20,cur.y);c.moveTo(cur.x,cur.y-20);c.lineTo(cur.x,cur.y+20);c.stroke();c.restore();
  }
  flights.forEach(f=>{const k=clamp((t-f.t0)/f.dur,0,1);
    bristle(c,f.sx+(f.tx-f.sx)*k,f.sy+(f.ty-f.sy)*k,Math.atan2(f.sy-f.ty,f.sx-f.tx),32)});
  c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  c.font='800 20px "Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif';
  floats.forEach(fl=>{const k=(t-fl.t0)/.9,y=fl.y-k*30;c.globalAlpha=1-k*k;
    c.lineWidth=5;c.strokeStyle='#fff';c.strokeText(fl.txt,fl.x,y);c.fillStyle=INK;c.fillText(fl.txt,fl.x,y)});
  c.globalAlpha=1;
}
let last=0;
function frame(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(frame)}

$('startBtn').onclick=()=>{si=0;begin();beep(1,.01,'sine',.0001)};
$('againBtn').onclick=begin;
$('nextBtn').onclick=()=>{si++;begin()};
$('again2').onclick=()=>{si=0;begin()};
resize();spots=mkSpots();hud();requestAnimationFrame(frame);

</script>
</body>
</html>
